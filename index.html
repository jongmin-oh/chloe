<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chloe</title>
<meta name="description" content="한국말이 서툰 Chloe와 매일 나누는 영어 대화.">
<meta property="og:title" content="Chloe">
<meta property="og:description" content="한국말이 서툰 Chloe와 매일 나누는 영어 대화.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 1스크린 -->
<section class="screen hero">
  <h1 data-copy="head"></h1>
  <p class="sub" data-copy="sub"></p>
  <p class="body" data-copy="body"></p>

  <div class="mock mock-hero" data-mock="hero"></div>

  <div class="cta">
    <button class="btn" data-download="ios">iPhone에서 받기</button>
    <button class="btn" data-download="android">Android에서 받기</button>
  </div>
  <p class="ai-note">Chloe는 AI 캐릭터입니다. 실존 인물이 아닙니다.</p>
</section>

<!-- 2스크린 -->
<section class="screen chats" data-chats></section>

<!-- 3스크린 -->
<section class="screen closing">
  <h2 data-copy="closeHead"></h2>
  <p class="body" data-copy="closeBody"></p>
  <div class="cta">
    <button class="btn" data-download="ios">iPhone에서 받기</button>
    <button class="btn" data-download="android">Android에서 받기</button>
  </div>
</section>

<footer>
  <p>Chloe는 AI 캐릭터입니다. 실존 인물이 아닙니다.</p>
</footer>

<!-- 모달 -->
<div class="overlay" data-overlay hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="close" data-close aria-label="닫기">&times;</button>

    <!-- 1단계 -->
    <div data-step="1">
      <h3 id="modal-title">아직 출시 준비 중이에요</h3>
      <p>Chloe는 지금 친구들을 만날 준비를 열심히 하고 있어요.<br>이메일을 남겨주시면 정식 출시 때 <b>첫 달 50% 할인 쿠폰</b>을 가장 먼저 보내드릴게요.</p>
      <form data-email-form>
        <input type="email" name="email" required autocomplete="email" placeholder="이메일 주소를 입력해 주세요" aria-label="이메일 주소">
        <button class="btn btn-primary" type="submit">할인 쿠폰 & 알림 받기</button>
      </form>
    </div>

    <!-- 2단계 (완료) -->
    <div data-step="2" hidden>
      <h3>고맙습니다 ✓</h3>
      <p>출시되는 날, 50% 할인 쿠폰과 함께 가장 먼저 연락드릴게요.</p>
      <button class="btn btn-primary" data-close>닫기</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
